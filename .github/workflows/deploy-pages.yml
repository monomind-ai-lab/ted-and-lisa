# Deploys the public site (site/ → html.monomind.one) to Cloudflare Pages
# on every push to main.
#
# The Pages project is a direct-upload project, so this workflow *is* the
# git connection: it assembles site/ (site/sync.sh) and ships it with
# wrangler.
#
# TWO CHECKOUTS. Since the website was split out of the skill, site/sync.sh
# reads from two repositories: this one for the previews and brand images,
# and monomind-ai-lab/hi-ted-meet-lisa for the template registry, the
# gallery thumbnails, the intake panel and the MonoMind mark. The second
# checkout lands at .skill/, which is the default sync.sh looks for
# (override with SKILL_DIR). That repository is public, so the default
# GITHUB_TOKEN reads it — no extra secret, no PAT.
#
# Both jobs of the old single repository still hold here: sync.sh fails
# loudly if the skill checkout is missing or incomplete, and the pre-deploy
# gates below run against that checkout so they check the panel and the
# registry it is about to ship rather than ones from some other commit.
#
# There are three of those gates. Two are one per gallery: the intake panel's
# fallback list is generated, and its check lives in the skill repository; the
# landing page's gallery is hand-written prose, and its check lives here
# (scripts/check_gallery.py). A deploy that shipped a gallery missing a
# template would look fine from the outside — which is exactly how
# motion-website stayed unreachable for a release wave.
#
# The third, scripts/check_gallery_translations.py, is the same class of
# silent drift one level in: a card that exists but has no entries in the `T`
# table renders English inside a Korean or Chinese page, and looks fine from
# the outside in English. It needs neither checkout's registry — only
# site/index.html — so it runs first.
#
# All three run before the assembly and any one of them stops the deploy.
#
# One repository secret is required:
#   CLOUDFLARE_API_TOKEN — a Cloudflare API token with permission
#   "Account · Cloudflare Pages · Edit" on the 1TM account.
#   Create it at https://dash.cloudflare.com/profile/api-tokens, then:
#   gh secret set CLOUDFLARE_API_TOKEN
#
# One is optional:
#   CF_BEACON_TOKEN — the Cloudflare Web Analytics site token (cookieless,
#   no consent banner needed). Dashboard → Web Analytics → Add a site →
#   html.monomind.one, then: gh secret set CF_BEACON_TOKEN
#   While it is unset, sync.sh skips the beacon rather than shipping a
#   placeholder.
#
# The account id is not a secret and is set inline below. The Pages project
# is still named hi-ted-meet-lisa — it is the project the custom domain and
# the analytics bindings hang off, so it keeps the name the site was
# created under whatever the repository is called.
#
# The wrangler step runs from the repository root, not from site/. That is
# load-bearing: wrangler compiles functions/ from the current working
# directory, so `pages deploy site` at the root is what carries functions/e.js
# and functions/SKILL.md.js up with the static files.

name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
      - name: Check out the skill repository
        # The panel, the registry, the thumbnails and the mark come from
        # here. Public repository, so the workflow's own token is enough.
        uses: actions/checkout@v4
        with:
          repository: monomind-ai-lab/hi-ted-meet-lisa
          path: .skill
      - name: Check the gallery cards against the translation table
        # The landing page's card copy is hand-written in three languages, so
        # a card is translated only when somebody writes its `T` entries. Fail
        # here rather than deploy a gallery that turns half-English the moment
        # a reader switches language. Reads site/index.html alone — no
        # registry, either checkout's — and runs from the repository root,
        # which is where it resolves site/ from.
        run: python3 scripts/check_gallery_translations.py
      - name: Check the intake panel's fallback list against the registry
        # The panel's file:// fallback copy of templates/templates.json is
        # generated, not hand-maintained. Fail here rather than ship a
        # canonical HTML file whose offline gallery is missing a template.
        # Both files live in the skill checkout, and the script reports its
        # findings as paths relative to that repository's root — so run it
        # from there.
        working-directory: .skill
        run: python3 scripts/tedandlisa_intake_fallback.py --check
      - name: Check the landing-page gallery against the registry
        # The other half of the same class of bug. The gallery in
        # site/index.html is hand-written — its card copy is editorial and
        # lives in three languages — so a template added upstream gains a
        # card only when somebody writes one. Fail here rather than deploy a
        # landing page with no way to reach a template the site is serving.
        # Runs from the repository root and reads the registry from .skill/,
        # which is where the checkout above put it.
        run: python3 scripts/check_gallery.py
      - name: Assemble the deployable site folder
        run: bash site/sync.sh
        env:
          CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e9ac0943443affe2bd7b18971265deee
          command: pages deploy site --project-name hi-ted-meet-lisa --branch main --commit-hash ${{ github.sha }}
