# Runs the site assembly on every pull request — the same `bash site/sync.sh`
# the deploy workflow runs, minus the deploy. Without this, the first time a
# PR's changes meet the build is after merge, on main, in deploy-pages.yml.
#
# Same two checkouts as the deploy: sync.sh reads the template registry, the
# gallery thumbnails, the intake panel and the MonoMind mark from
# monomind-ai-lab/hi-ted-meet-lisa, which it expects at .skill/ (public
# repository, so the workflow's own token reads it — no secret).
#
# No secrets on purpose: CF_BEACON_TOKEN stays unset here, and sync.sh
# skips the analytics beacon when it is unset rather than failing or
# shipping a placeholder — so a fork PR builds identically.
#
# After the build, the skill repo's rendered-overflow gate runs over every
# preview: each file is loaded in headless Chrome (installed by
# browser-actions/setup-chrome, since ubuntu-latest ships no browser) at
# 1280/2000/375 and fails the PR when content escapes its box sideways —
# e.g. a long mono token overflowing a fixed grid column, which never
# widens the document and so is invisible to any static check.

name: PR build check

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
      - name: Check out the skill repository
        uses: actions/checkout@v4
        with:
          repository: monomind-ai-lab/hi-ted-meet-lisa
          path: .skill
      - name: Assemble the deployable site folder
        run: bash site/sync.sh
      - name: Install Chrome for the rendered checks
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          # Stable release, not the action's default chromium snapshot —
          # a snapshot build hung on every page load in the skill repo's
          # CI; see the matching comment in that repo's checks.yml.
          chrome-version: stable
      - name: Check the previews for rendered horizontal overflow
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python3 .skill/scripts/check_overflow.py previews/*.html
